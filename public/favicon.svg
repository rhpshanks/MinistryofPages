<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background: Rounded square with rich dark slate color -->
  <rect width="512" height="512" rx="128" fill="#0f172a" />
  
  <!-- Serif "M" letter -->
  <text
    x="80"
    y="380"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="380"
    font-weight="bold"
    fill="#ffffff"
    letter-spacing="-10"
  >M</text>
  
  <!-- Superscript italic "p" in amber/gold -->
  <text
    x="350"
    y="210"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="170"
    font-style="italic"
    fill="#d97706"
  >p</text>
</svg>
